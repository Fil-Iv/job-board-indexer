# Platforms where the site refuses our crawler (robots.txt rule or HTTP 401/403/429), or
# where the only route is one we decided not to use: such evidence carries a `policy`
# reason (e.g. an internal host) instead of a refusal.
# Every entry is a real request made with jobindex.access.check_access, User-Agent
# "JobIndexBot/0.1 (+https://example.com/jobindex-bot)". DNS/TLS failures and robots.txt
# 5xx are outages, not blocks, and are deliberately NOT listed (pass 2 had mislabelled
# jobs.dzone.com, jobs.techcrunch.com, boolerang.co.uk, jobkit.dev, jobs.mlops.community).
# Raw data: .research/access3*.jsonl, robots.txt copies: .research/robots3.txt.
blocked_by_site:
  - platform: SmartRecruiters
    scope: api
    impact: "Public Posting API refused (only LinkedInBot allowed); connector uses the public career pages instead."
    evidence:
      - {url: "https://api.smartrecruiters.com/v1/companies/Ubisoft2/postings", checked_at: "2026-11-07T06:16:08+00:00", http_status: null, robots_url: "https://api.smartrecruiters.com/robots.txt", robots_http_status: 200, robots_rule: "Disallow: /"}
