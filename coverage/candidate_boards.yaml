# Candidate boards for the hosted demo: tech, cybersecurity and remote-first employers on
# the fastest JSON platforms (one or a few requests per board). Checked live with
#     python scripts/check_boards.py            # -> coverage/candidate_results.json
#     python scripts/check_boards.py --write    # verified boards -> demo_sources.yaml
# Only boards whose list loads (robots.txt allowed, public API) and has open jobs are
# kept. Slugs are expanded to the platform's board URL (see URL_FORMS in the script);
# `workday` takes full career-site URLs.

