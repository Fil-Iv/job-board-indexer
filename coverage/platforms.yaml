  api: "GET {tenant}.applicantpro.com/job_site_map.xml (open jobs, lastmod) + GET {tenant}.applicantpro.com/jobs/{id}.html (JSON-LD JobPosting)"
  url_patterns: ["{tenant}.applicantpro.com/jobs/[{id}.html]", "www.applicantpro.com/openings/{tenant}/jobs/{id}"]
  examples:
    - https://mwra.applicantpro.com/jobs/
    - https://commquest.applicantpro.com/jobs/
  robots: allowed
  verified: 2026-11-07
  generic: yes
  notes: "Generic sitemap + JSON-LD connector. The per-tenant job_site_map.xml lists only open jobs; the tenant sitemap.xml (~1000 browse pages) is not used. validThrough is malformed (\"2026-12-03 00:00:00T23:59\"), its date is used; annual pay labelled HOUR is re-inferred."

