# ----------------------------------------------------------------- Job boards (20)
# Common pattern: most job-board platforms render server-side HTML with schema.org
# JobPosting JSON-LD on each job page, plus RSS and/or sitemap.xml. A single generic
# "jsonld_jobposting" connector (sitemap/RSS -> job pages -> JSON-LD) could cover many.

- name: Niceboard
  key: niceboard
  type: jobboard
  status: done
  connector: jobindex.connectors.niceboard
  public_api: "no"
  api: "GET {board}/sitemap.xml -> /sitemap-jobs.xml (lastmod) + GET each job page /job/{id}-{slug} (JSON-LD JobPosting)"
  url_patterns: ["{board}.niceboard.co", "custom domains (cdn.niceboard.co assets)", "{board}/job/{id}-{slug}"]
  examples:
    - https://jobs.nonprofittalent.com/
    - https://jobs.forcebrands.com/
  robots: allowed
  verified: 2026-11-07
  generic: yes
  notes: "Generic sitemap + JSON-LD connector (jobindex.connectors.generic_jsonld). The board API needs the owner key. Job pages fetched only when the sitemap lastmod changes."

- name: WP Job Manager
  key: wpjobmanager
  type: jobboard
  status: done
  connector: jobindex.connectors.wpjobmanager
  public_api: "yes"
  api: "GET {site}/wp-json/wp/v2/job-listings?per_page=100&page={n} (JSON, X-WP-Total/X-WP-TotalPages) + GET {site}/wp-json/wp/v2/job-types"
  url_patterns: ["any WordPress site (HTML fingerprint /wp-content/plugins/wp-job-manager/; site root from <link rel=https://api.w.org/>)"]
  examples:
    - https://startjob.dk/
    - https://fmals.de/
  example_companies:
    "https://fmals.de/": "F mal s GmbH"  # recruitment agency posting for unnamed clients
  robots: allowed
  verified: 2026-11-07
  notes: "WordPress plugin, so boards live on arbitrary domains and are only recognised from page HTML. REST lists publish posts only (expired excluded); _filled listings are dropped. The AJAX list /jm-ajax/get_listings/ is not used: HTML only, no descriptions, and on some themes includes expired listings (clsrecruitment.ie ~420 vs 29 open). Sites with the REST API disabled (kiwiconseil.fr: 404) or plain permalinks (?rest_route=) are not supported and fail loudly. Also verified on clsrecruitment.ie (29 jobs)."

