- name: BrassRing
  key: brassring
  type: ats
  status: todo
  tier: hard
  public_api: partial
  api: "GET {host}/TGnewUI/Search/Home/HomeWithPreLoad?partnerid={p}&siteid={s}&PageType=searchResults (preloadJSON: first 50 jobs + JobsCount) + PageType=JobDetails&jobid={reqid} (full posting); more than 50 only via POST /TgNewUI/Search/Ajax/ProcessSortAndShowMoreJobs"
  url_patterns: ["{sjobs|krb-sjobs|xjobs}.brassring.com/TGnewUI/Search/Home/Home?partnerid={p}&siteid={s}", "…/HomeWithPreLoad?partnerid={p}&siteid={s}&PageType=JobDetails&jobid={reqid}"]
  examples: []
  robots: allowed
  verified: null
  notes: "Not built (2026-11-08): no allowed route lists more than 50 jobs. robots.txt is 404 on sjobs/krb-sjobs/xjobs.brassring.com. The server-rendered HomeWithPreLoad?PageType=searchResults page embeds the first 50 jobs and the true JobsCount, and ignores every paging/keyword/sort parameter (PageNumber, page, pageno, keyword, SortType tried). Job details are complete over GET (PageType=JobDetails). Further pages exist only as POST /TgNewUI/Search/Ajax/ProcessSortAndShowMoreJobs carrying encryptedSessionValue (#CookieValue) and the RFT/__RequestVerificationToken issued by the page: page-issued tokens are not used. Sites checked: 9 live sites have 155-24,005 jobs (FCPS 25103/5042: 56; Home Depot 25526/5032: 24,005; 26235/5374: 681; 25771/5403: 2,164; 25879/5295: 949; 25633/5439: 1,350; 25307/5238: 319; xjobs 25348/5039: 155), 3 have 0 (Lockheed Martin migrated). A connector limited to boards of 50 jobs or fewer would work but no such live board was found."

