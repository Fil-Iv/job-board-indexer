    - https://wd3.myworkdaysite.com/recruiting/pwc/Global_Experienced_Careers
  robots: allowed
  verified: 2026-11-07
  notes: "Undocumented but public CXS JSON. One query returns at most 2000 postings (and total is capped at 2000, set only on page 1): above that the board is split by a partitioning facet (jobFamilyGroup etc.) and the union is checked against the timeType facet sum. Paging is resumable: progress is checkpointed in sources.crawl_checkpoint every 25 pages and a failed crawl resumes there (checkpoints expire after 2h). Descriptions need one request per job (first crawl of a 3k-job tenant ~50 min at 1 req/s, progress logged every 100); later crawls only fetch new/retitled jobs."

