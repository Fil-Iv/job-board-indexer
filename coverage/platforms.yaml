# JobIndex platform coverage plan — the source of truth for docs/COVERAGE.md.
#
# Regenerate the doc (live-crawls every `done` platform's examples):
#     make coverage
#
# Fields
#   name         display name
#   key          connector platform key (sources.platform); module = jobindex/connectors/<key>.py
#   type         ats | jobboard
#   status       todo | in_progress | done
#   tier         easy | medium | hard   (required unless done)
#                  easy   = public JSON API (or a structured XML/RSS feed, flagged in notes)
#                  medium = server-rendered HTML / embedded JSON (JSON-LD, __NEXT_DATA__, ...)
#                  hard   = JS-heavy, session/CSRF tokens, bot protection -> may need Playwright
#   public_api   yes | partial | feed | no | unknown
#                  (partial = JSON exists but needs a token/header/params from the page;
#                   feed = XML/RSS, not JSON)
#   api          the endpoint we would use
#   url_patterns URL shapes connector.detect() must recognise
#   examples     live boards from different employers (>= 2 required for done)
#   robots       allowed | blocked | per-tenant | unknown   (for the API/listing host)
#   verified     date the api + examples were confirmed with a live request; null = from
#                docs/prior knowledge only, re-check before implementing
#   notes        anything the implementer must know
#
# Research for this file was done on 2026-11-07 (one request per endpoint, robots.txt
# checked with jobindex.robots).

# ---------------------------------------------------------------------------- ATS (58)

- name: ADP
  key: adp
  type: ats
  status: done
  connector: jobindex.connectors.adp
  public_api: partial
  api: "GET workforcenow.adp.com/mascsr/default/careercenter/public/events/staffing/v1/job-requisitions?cid={cid}&lang=&locale=&$top=100&$skip={1-based start} + .../job-requisitions/{itemID} (description)"
  url_patterns: ["workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid={uuid}[&lang=xx_YY]"]
  examples:
    - https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=d4d64eb4-d344-423a-868e-ae5d37380d2f&ccId=19000101_000001&lang=en_US
    - https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=8d16626f-48ae-43f6-b57e-79339726ccf4&ccId=19000101_000001&lang=en_CA
  example_companies:
    "https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=8d16626f-48ae-43f6-b57e-79339726ccf4&ccId=19000101_000001&lang=en_CA": "Old Port of Montréal"
  robots: allowed
  verified: 2026-11-07
  generic: no
  notes: "Workforce Now only (Recruiting Management and myjobs.adp.com not covered). Undocumented JSON behind the SPA; works without cookies. $skip is the 1-based start position, so pages are requested from 1 + jobs so far and checked against totalNumber. Postings are per language: the board id carries :lang when not en_US (the Canadian example lists 3 jobs with en_CA, 0 with en_US). robots.txt is an HTML redirector page (no rules)."

- name: ApplicantPro
