  url_patterns: ["{tenant}.wd{n}.myworkdayjobs.com/[{locale}/]{site}[/job/...]", "[{tenant}.]wd{n}.myworkdaysite.com/[{locale}/]recruiting/{tenant}/{site}", "{host}/wday/cxs/{tenant}/{site}/...", "custom domains: links to the above"]
