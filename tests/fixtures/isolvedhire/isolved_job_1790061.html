	{"@context":"http:\/\/schema.org\/","@type":"JobPosting","title":"HCM Field Sales Representative","url":"https:\/\/isolved.isolvedhire.com\/jobs\/1790061.html","description":"<p><span style=\"0font-family: verdana,;\">Join isolved as a HCM Field Sales Representative and dive into a world of exhilarating challenges within the Human Resources industry! You will have the chance to engage with dynamic, forward-thinking clients, creating tailored solutions that elevate their workforce experience. This role offers an exciting opportunity to showcase your problem-solving skills and collaborate with a passionate team dedicated to driving innovation.<\/span><\/p>\n<p><span style=\"0font-family: verdana,;\">As you contribute to our culture of high performance and customer-centricity, you'll play a pivotal role in shaping the future of HR solutions. Apply now and become a key player in a thriving organization where your contributions truly matter!<\/span><\/p>\n<h3 style=\"0text-transform: uppercase;\"><span style=\"color: #e50082;\"><strong>Hello, we're isolved<\/strong><\/span><\/h3>\n<p><span style=\"0font-family: verdana,;\">isolved is the most-trusted HCM technology leader, providing the best combination of software and services to meet the needs of today's People Heroes - HR, payroll, and benefits professionals. From talent acquisition to workforce management to talent management, our solutions are delivered directly or through our HRO partner network to more than 5 million employees and 145,000 employers across all 50 states - who use them every day to increase productivity, accelerate decision-making and ensure performance, while reducing risk. isolved People Cloud, our intelligently connected platform, automates the entire employee experience by design, so that organizations can engage, empower, and energize their talent while freeing their People Heroes to exceed their goals and grow their careers.<\/span><\/p>\n<ul>\n<li style=\"0line-height: normal;\"><span style= e: 10pt; font-family: verdana,;\">HCM experience required <\/span><\/li>\n<li style=\"0line-height: normal; background: #FFFFFF;\"><span style=\"0font-size: 10pt; font-family: verdana,;\">Excellent communication skills to effectively engage with all personalities and business roles <\/span><\/li>\n<li style=\"0line-height: normal; background: #FFFFFF;\"><span style=\"0font-family: verdana,;\"><span style=\"0font-size: 10pt; color: #494949;\">A creative and independent thinker with a strong m<\/span><span style=\"0font-size: 10pt; color: #494949;\">otivation for sales<\/span><\/span><\/li>\n<li style=\"0line-height: normal; background: #FFFFFF;\"><span style=\"0font-size: 10pt; font-family: verdana,;\">A desire to continually grow and apply new skills<\/span><\/li>\n<\/ul>\n<h3 style=\"0text-transform: uppercase;\"><span style=\"color: #e50082;\"><strong>Join us!<\/strong><\/span><\/h3>\n<p><span style=\"0font-family: verdana,;\">If you think this job aligns with your requirements, then submitting an application is simple. Good luck!<\/span><\/p>","identifier":{"@type":"PropertyValue","name":"isolved","sameAs":"1790061"},"datePosted":"2026-06-08 00:00:00","validThrough":"2031-06-08 00:00:00T23:59","employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","value":"","unitText":""}},"hiringOrganization":{"@type":"Organization","name":"isolved","sameAs":"https:\/\/isolved.isolvedhire.com"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"","addressLocality":"","addressRegion":"","postalCode":"00000","addressCountry":"US"},"geo":{"@type":"GeoCoordinates","latitude":"0.00000000000000","longitude":"0.00000000000000"}}}</script>
