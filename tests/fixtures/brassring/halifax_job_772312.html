leaning as necessary as well as minor mechanical repairs. Associated paperwork and data entry are required. &amp;nbsp;The Hostler Repairperson may also perform signage maintenance duties. The Hostler Repairperson is responsible for performing this work following all relevant safety procedures. The Hostler Repairperson must possess a valid driver’s license with airbrake endorsement, an acceptable driver’s abstract, and the ability to obtain a Class 2 driver’s license.&lt;br&gt;&lt;br&gt;&lt;strong&gt;DUTIES AND RESPONSIBILITIES:&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&lt;u&gt;Placer Stand:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Data entry of bus parking matrix into Trapeze (Operational Routing Tool) on a daily basis.&lt;/li&gt;&lt;li&gt;Emptying of Fare boxes from the vehicle.&lt;/li&gt;&lt;li&gt;Monitor of vehicle status and appropriate placement of buses in the fleet yard in accordance with the hoist sheet.&lt;/li&gt;&lt;li&gt;Communicate with operations (dispatch) as required with regards to the parking matrix.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Fueling:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Fueling buses.&lt;/li&gt;&lt;li&gt;Checking and topping up all fluids including transmission, engine oil, coolant, windshield washer, urea.&lt;/li&gt;&lt;li&gt;Report any service line defects to the supervisor.&lt;/li&gt;&lt;li&gt;Record bus numbers, kilometers and total fuel consumption using data entry system.&lt;/li&gt;&lt;li&gt;Check tires and wheel nuts and report any defects to the supervisor.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Driving:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Operate the transit vehicles as needed to prepare and position them for service.&lt;/li&gt;&lt;li&gt;Sweep interior of the bus and remove any debris (e.g., Newspapers) or lost and found items.&lt;/li&gt;&lt;li&gt;Wipe down the driver’s area, dashes, and windows.&lt;/li&gt;&lt;li&gt;Empty Fare box.&lt;/li&gt;&lt;li&gt;Drive and place the bus as directed by the placer’s parking matrix.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Interior Wash/Cleaning:&lt;/u&gt;&amp;nbsp;&amp;nbsp;&lt;ul&gt;&lt;li&gt;Mopping floors, scrubbing walls and ceilings, cleaning windows, removal of debris from the bus.&lt;/li&gt;&lt;li&gt;At times, removal of hazardous material.&lt;/li&gt;&lt;li&gt;Use of a variety of cleaning products and chemicals.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Minor Maintenance/Repairs:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Minor mechanical repairs to the fleet (i.e., replacing bulbs, wiper blades and mirrors, tire repairs and grease and oil changes).&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Bus Stops &amp;amp; Shelters:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Perform Signage maintenance including graffiti removal, Bus Stops, Shelters, Transit Terminals and at Park &amp;amp; Ride locations.&lt;/li&gt;&lt;li&gt;Other duties, as assigned.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;QUALIFICATIONS:&lt;br&gt;Education and Experience:&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Grade 12 or equivalent.&lt;/li&gt;&lt;li&gt;2 years’ experience in the servicing of fleet vehicles (e.g., checking oils, fluids, coolant, fueling, cleaning and general operation) and completing minor mechanical repairs. (e.g., changing wiper blades, tires, headlights, and fluids).&lt;/li&gt;&lt;li&gt;Experience in operating shop equipment (e.g., fork truck, brake lathe, jack hammers, hand tools, air tools).&lt;/li&gt;&lt;li&gt;Knowledge of Halifax Transit service (e.g., Bus Stops, Shelters, Terminals, and bus routes).&lt;/li&gt;&lt;li&gt;Class 5 Driver’s license with airbrake endorsement, acceptable driver’s abstract, and the ability to obtain a class 2 license.&lt;/li&gt;&lt;li&gt;Demonstrated experience in the use of computer applications.&lt;/li&gt;&lt;li&gt;Must be punctual and reliable.&lt;/li&gt;&lt;li&gt;Proven ability to work as part of a team.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;Technical / Job Specific Knowledge and Abilities:&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Follow Safe Work Practices.&lt;/li&gt;&lt;li&gt;Must supply and use basic hand tools.&lt;/li&gt;&lt;li&gt;Read and interpret policies, procedural manuals, MSDS sheets and other work-related documents.&lt;/li&gt;&lt;li&gt;Follow written and oral instructions.&lt;/li&gt;&lt;li&gt;Utilize computer equipment to input work order information and complete other basic computer functions.&lt;/li&gt;&lt;li&gt;Manage time, priorities, and work in pressure situations with multiple deadlines.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;PHYSICAL DEMANDS:­&lt;/strong&gt;&lt;br&gt;(None - Not at All; Occasional - 1 to 2.5 hrs; Frequent - 2.5 to 5.5 hrs)&lt;ul&gt;&lt;li&gt;Standing – Frequent&lt;/li&gt;&lt;li&gt;Walking – Frequent&lt;/li&gt;&lt;li&gt;Bending – Occasional to Frequent&lt;/li&gt;&lt;li&gt;Squatting – Occasional&lt;/li&gt;&lt;li&gt;Lifting – Occasional to Frequent (Up to 25 lbs, with assistance)&lt;/li&gt;&lt;li&gt;Pushing/Pulling – Occasional to Frequent (Up to 50 lbs, with assistance)&lt;/li&gt;&lt;li&gt;Carrying – Occasional (up to 25 lbs, with assistance)&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;Security Clearance Requirements:&lt;/strong&gt; Applicants may be required to complete an employment security screening check.&amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;strong&gt;Please note:&lt;/strong&gt;&amp;nbsp;Testing may be conducted as a component of the selection process to assess technical and job specific knowledge. Candidates who are selected for testing, may be tested in a group setting, scheduled at the employer’s discretion.&amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;strong&gt;Please note:&lt;/strong&gt;&amp;nbsp;Candidates will be required to provide proof of their valid certificates and licenses, per the educational technical qualifications, prior to being invited for an interview.&lt;br&gt;&lt;br&gt;&lt;strong&gt;COMPETENCIES:­ &lt;/strong&gt;Customer Service; Teamwork &amp;amp; Cooperation; Communication; Valuing Diversity; Organization and Planning.&lt;br&gt;&lt;br&gt;&lt;strong&gt;WORK STATUS: &lt;/strong&gt;­Permanent, full-time&lt;b
