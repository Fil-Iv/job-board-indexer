s of Hostler Repairperson in the Transit Fleet division of Halifax Transit.&lt;br&gt;&lt;br&gt;Halifax Regional Municipality (HRM) is committed to reflecting the community it serves and recognizing Diversity and Inclusion as one of the Municipality’s core values. We have an Employment Equity Policy, and we welcome applications from African Nova Scotians and Other Racially Visible Persons, Women in occupations or positions where they are underrepresented in the workforce, Indigenous/Aboriginal People, Persons with Disabilities and 2SLGBTQ+ Persons. &amp;nbsp;Applicants are encouraged to self-identify on their electronic application.&lt;br&gt;&lt;br&gt;The Hostler Repairperson, Halifax Transit, under the direction of the Fleet Supervisor, Transit Fleet performs the necessary duties to prepare and ensure all buses are ready for the following day service. &amp;nbsp;Duties include but are not limited to cleaning, fueling, maintaining fluids and performing special cleaning as necessary as well as minor mechanical repairs. Associated paperwork and data entry are required. &amp;nbsp;The Hostler Repairperson may also perform signage maintenance duties. The Hostler Repairperson is responsible for performing this work following all relevant safety procedures. The Hostler Repairperson must possess a valid driver’s license with airbrake endorsement, an acceptable driver’s abstract, and the ability to obtain a Class 2 driver’s license.&lt;br&gt;&lt;br&gt;&lt;strong&gt;DUTIES AND RESPONSIBILITIES:&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&lt;u&gt;Placer Stand:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Data entry of bus parking matrix into Trapeze (Operational Routing Tool) on a daily basis.&lt;/li&gt;&lt;li&gt;Emptying of Fare boxes from the vehicle.&lt;/li&gt;&lt;li&gt;Monitor of vehicle status and appropriate placement of buses in the fleet yard in accordance with the hoist sheet.&lt;/li&gt;&lt;li&gt;Communicate with operations (dispatch) as required with regards to the parking matrix.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Fueling:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Fueling buses.&lt;/li&gt;&lt;li&gt;Checking and topping up all fluids including transmission, engine oil, coolant, windshield washer, urea.&lt;/li&gt;&lt;li&gt;Report any service line defects to the supervisor.&lt;/li&gt;&lt;li&gt;Record bus numbers, kilometers and total fuel consumption using data entry system.&lt;/li&gt;&lt;li&gt;Check tires and wheel nuts and report any defects to the supervisor.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Driving:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Operate the transit vehicles as needed to prepare and position them for service.&lt;/li&gt;&lt;li&gt;Sweep interior of the bus and remove any debris (e.g., Newspapers) or lost and found items.&lt;/li&gt;&lt;li&gt;Wipe down the driver’s area, dashes, and windows.&lt;/li&gt;&lt;li&gt;Empty Fare box.&lt;/li&gt;&lt;li&gt;Drive and place the bus as directed by the placer’s parking matrix.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Interior Wash/Cleaning:&lt;/u&gt;&amp;nbsp;&amp;nbsp;&lt;ul&gt;&lt;li&gt;Mopping floors, scrubbing walls and ceilings, cleaning windows, removal of debris from the bus.&lt;/li&gt;&lt;li&gt;At times, removal of hazardous material.&lt;/li&gt;&lt;li&gt;Use of a variety of cleaning products and chemicals.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Minor Maintenance/Repairs:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Minor mechanical repairs to the fleet (i.e., replacing bulbs, wiper blades and mirrors, tire repairs and grease and oil changes).&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;u&gt;Bus Stops &amp;amp; Shelters:&lt;/u&gt;&lt;ul&gt;&lt;li&gt;Perform Signage maintenance including graffiti removal, Bus Stops, Shelters, Transit Terminals and at Park &amp;amp; Ride locations.&lt;/li&gt;&lt;li&gt;Other duties, as assigned.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;QUALIFICATIONS:&lt;br&gt;Education and Experience:&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Grade 12 or equivalent.&lt;/li&gt;&lt;li&gt;2 years’ experience in the servicing of fleet vehicles (e.g., checking oils, fluids, coolant, fueling, cleaning and general operation) and completing minor mechanical repairs. (e.g., changing wiper blades, tires, headlights, and fluids).&lt;/li&gt;&lt;li&gt;Experience in operating shop equipment (e.g., fork truck, brake lathe, jack hammers, hand tools, air tools).&lt;/li&gt;&lt;li&gt;Knowledge of Halifax Transit service (e.g., Bus Stops, Shelters, Terminals, and bus routes).&lt;/li&gt;&lt;li&gt;Class 5 Driver’s license with airbrake endorsement, acceptable driver’s abstract, and the ability to obtain a class 2 license.&lt;/li&gt;&lt;li&gt;Demonstrated experience in the use of computer applications.&lt;/li&gt;&lt;li&gt;Must be punctual and reliable.&lt;/li&gt;&lt;li&gt;Proven ability to work as part of a team.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;Technical / Job Specific Knowledge and Abilities:&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Follow Safe Work Practices.&lt;/li&gt;&lt;li&gt;Must supply and use basic hand tools.&lt;/li&gt;&lt;li&gt;Read and interpret policies, procedural manuals, MSDS sheets and other work-related documents.&lt;/li&gt;&lt;li&gt;Follow written and oral instructions.&lt;/li&gt;&lt;li&gt;Utilize computer equipment to input work order information and complete other basic computer functions.&lt;/li&gt;&lt;li&gt;Manage time, priorities, and work in pressure situations with multiple deadlines.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;PHYSICAL DEMANDS:­&lt;/strong&gt;&lt;br&gt;(None - Not at All; Occasional - 1 to 2.5 hrs; Frequent - 2.5 to 5.5 hrs)&lt;ul&gt;&lt;li&gt;Standing – Frequent&lt;/li&gt;&lt;li&gt;Walking – Frequent&lt;/li&gt;&lt;li&gt;Bending – Occasional to Frequent&lt;/li&gt;&lt;li&gt;Squatting – Occasional&lt;/li&gt;&lt;li&gt;Lifting – Occasional to Frequent (Up to 25 lbs, with assistance)&lt;/li&gt;&lt;li&gt;Pushing/Pulling – Occasional to Frequent (Up to 50 lbs, with assistance)&lt;/li&gt;&lt;li&gt;Carrying – Occasional (up to 25 lbs, with assistance)&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;Security Clearance Requirements:&lt;/strong&gt; Applicants may be required to complete an employment security screening check.&amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;strong&gt;Please note:&lt;/strong&gt;&amp;nbsp;Testing may be conducted as a component of the selection process to assess technical and job specific knowledge. Candidates who are selected for testing, may be tested in a group setting, scheduled at the employer’s discretion.&amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;strong&gt;Please note:&lt;/strong&gt;&amp;nbsp;Candidates will be required to provide proof of their valid certificates and licenses, per the educational technical qualifications, prior to being invited for an interview.&lt;br&gt;&lt;br&gt;&lt;strong&gt;COMPETENCIES:­ &lt;/strong&gt;Customer Service; Teamwork &amp;amp; Cooperation; Communication; Valuing Diversity; Organization and Planning.&lt;br&gt;&lt;br&gt;&lt;strong&gt;WORK STATUS: &lt;/strong&gt;­Permanent, full-time&lt;br&gt;&lt;br&gt;&lt;strong&gt;HOURS OF WORK:&amp;nbsp;&lt;/strong&gt;&lt;br&gt;&lt;strong&gt;Shift 1 - Position #78606332 - RLTC (40 hours per week)&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Workdays: Tuesday to Saturday&lt;/li&gt;&lt;li&gt;Shift Time: 7:00 p.m. – 3:00 a.m.&lt;/li&gt;&lt;li&gt;Holidays: Required to work holidays&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;Shift 2 - Position #72295256 - RLTC (40 hours per week)&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Workdays: Tuesday to Saturday&lt;/li&gt;&lt;li&gt;Shift Time: 3:30 p.m. – 11:30 p.m.&lt;/li&gt;&lt;li&gt;Holidays: Required to work holidays&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;Shift 3 - Position #78612141 - BTC (40 hours per week)&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Workdays: Monday to Friday&lt;/li&gt;&lt;li&gt;Shift Times:&amp;nbsp;11:30 p.m. – 7:00 a.m.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Holidays: Required to work holidays&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;Shift 4 - Position #72295259 - BTC (40 hours per week)&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Workdays: Sunday to Thursday&lt;/li&gt;&lt;li&gt;Shift Time: 7:00 p.m. – 3:00 a.m.&lt;/li&gt;&lt;li&gt;Holidays: Required to work holidays&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;SALARY:&lt;/strong&gt;­ $30.42 per hour according to the Collective Agreement between the Amalgamated Transit Union, Local 508 and Halifax Regional Municipality.&lt;br&gt;&lt;br&gt;&lt;strong&gt;WORK LOCATION:&amp;nbsp;&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Ragged Lake Transit Center, 110 Grassy Lake Drive, Halifax, NS, B3S 0E8&lt;/li&gt;&lt;li&gt;Burnside Transit Centre, 200 Ilsley Avenue, Dartmouth, NS B3B 1V1&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;strong&gt;CLOSING DATE:&lt;/strong&gt; Applications will be received up to &lt;strong&gt;11:59 pm on Thursday, November 12, 2026.&lt;/strong&gt;&amp;nbsp;Both paper and online applications will be accepted.&lt;br&gt;&lt;br&gt;&lt;strong&gt;This is a bargaining unit position.­ External applicants will only be considered if there are no qualified bargaining unit candidates.&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&lt;strong&gt;Please note:&lt;/strong&gt; We thank all applicants for their interest in this position. Only those applicants selected for an interview/testing will be contacted.&lt;br&gt;&lt;br&gt;To ensure a fair and equitable hiring process, candidates are expected to complete all parts of the recruitment process, including assessments, assignments, and interviews independently and without the use of artificial intelligence (AI) tools or other forms of external assistance. The use of AI to complete any component of the hiring process is not permitted and may result in disqualification from consideration.&lt;br&gt;&lt;br&gt;Shortlisted candidates will be required to provide proof of their qualifications, including, but not limited to, educational credentials, professional licenses, and relevant certifications.&lt;br&gt;&lt;br&gt;During the recruitment process, applicants have the right to request an accommodation. Applicants invited to participate ;&lt;p dir=\&quot;ltr\&quot;&gt;Halifax Regional Municipality is inviting applications for the permanent, full-time position of Automotive Mechanic in the Transit Fleet division of Halifax Transit.&lt;br&gt;&lt;br&gt;Halifax Regional Municipality (HRM) is committed to reflecting the community it serves and recognizing Diversity and Inclusion as one of the Municipality’s core values. We have an Employment Equity Policy, and we welcome applications from African Nova Scotians and other Racially Visible Persons, Women in&amp;nbsp;occupations or positions where they are underrepresented in the workforce, Indigenous/Aboriginal People, Persons with Disabilities and 2SLGBTQ+ Persons. Applicants are encouraged to self-identify on their electronic application.&lt;br&gt;&lt;br&gt;Under the direction of the Superintendent of Transit Fleet, Halifax Transit, the Mechanic will be accountable to perform mechanical repairs and preventative maintenance on various types of transit vehicles including but not limited to replacing and repairing engines, alternators, starters, transmissions, differentials, drive lines, radiators, and brake systems.&lt;br&gt;&lt;br&gt;&lt;strong&gt;DUTIES AND RESPONSIBILITIES:&lt;/strong&gt;&lt;/p&gt;&lt;ul dir=\&quot;ltr\&quot;&gt;&lt;li&gt;Diagnose, determine the source and extent of, and carry out the necessary repairs to all types of equipment, diesel/gas, and hydraulic equipment contained in a major transit fleet operation.&lt;/li&gt;&lt;li&gt;Must carry out provincial motor vehicle inspection on para-transit buses.&lt;/li&gt;&lt;li&gt;Support fleet maintenance on overtime.&lt;/li&gt;&lt;li&gt;Must have a good working knowledge of Preventative Maintenance and how it pertains to a fleet operation.&lt;/li&gt;&lt;li&gt;Other duties as assigned.&lt;/li&gt;&lt;/ul&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;br&gt;&lt;strong&gt;QUALIFICATIONS:&lt;br&gt;Education and Experience:&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Grade 12 or equivalent education and experience.&lt;/li&gt;&lt;li&gt;Five (5) years’ experience in the repair and maintenance of fleet vehicles. Minimum twelve (12) months of recent experience as licensed Automotive Mechanic.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Must possess a valid Red Seal Journeyperson Technician’s License in the Automotive Service repair trade meeting parameters as described under the Nova Scotia Apprenticeship Agency.&lt;/li&gt;&lt;li&gt;Must possess or is willing to obtain a Nova Scotia Motor Vehicle Safety Inspection License.&lt;/li&gt;&lt;li&gt;Possess a valid driver’s license, with a good driving record (a current abstract is required).&lt;/li&gt;&lt;/ul&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;br&gt;&lt;strong&gt;Technical / Job Specific Knowledge and Abilities:&lt;/strong&gt;&lt;/p&gt;&lt;ul dir=\&quot;ltr\&quot;&gt;&lt;li&gt;Must have full understanding of Preventative Maintenance Program as it pertains to automotive and light/medium duty trucks&lt;/li&gt;&lt;li&gt;Familiarity with computers and a computerized work order system&lt;/li&gt;&lt;li&gt;Must be in good physical condition&lt;/li&gt;&lt;li&gt;Reliable and punctual&lt;/li&gt;&lt;li&gt;Good oral and written communication skills&lt;/li&gt;&lt;li&gt;Must have own hand tools&lt;/li&gt;&lt;li&gt;Ability to work with minimal supervision&lt;/li&gt;&lt;li&gt;Diesel Diagnosis and Service&lt;/li&gt;&lt;li&gt;Allison Automatic Transmission Diagnosis and Service&lt;/li&gt;&lt;li&gt;GM/Ford HVAC Systems / Green Card&lt;/li&gt;&lt;li&gt;GM/Ford Safety Systems&lt;/li&gt;&lt;li&gt;GM/Ford Electrical / Electronics&lt;/li&gt;&lt;li&gt;GM/Ford Rear Axel Diagnosis and service&lt;/li&gt;&lt;/ul&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;br&gt;&lt;strong&gt;PHYSICAL DEMANDS:­&lt;/strong&gt;&lt;br&gt;(None - Not at All; Occasional - 1 to 2.5 hrs.; Frequent - 2.5 to 5.5 hrs.)&lt;/p&gt;&lt;ul dir=\&quot;ltr\&quot;&gt;&lt;li&gt;Standing – Frequent&lt;/li&gt;&lt;li&gt;Walking – Frequent&lt;/li&gt;&lt;li&gt;Bending – Frequent&lt;/li&gt;&lt;li&gt;Squatting – Occasional&lt;/li&gt;&lt;li&gt;Lifting – Mechanics are expected to use assistance with material handling over 50lbs&lt;/li&gt;&lt;li&gt;Pushing/Pulling – Mechanics are expected to use assistance with material handling over 50lbs&lt;/li&gt;&lt;li&gt;Head/Neck dexterity – Frequent&lt;/li&gt;&lt;/ul&gt;&lt;p dir=\&quot;ltr\&quot;&gt;&lt;br&gt;&lt;strong&gt;Security Clearance Requirements&lt;/strong&gt;: Applicants may be required to complete an employment security screening check.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Please Note:&amp;nbsp;&lt;/strong&gt;Testing may be conducted as a component of the selection process to assess technical and job specific knowledge. Candidates who are selected for testing, may be tested in a group setting, scheduled at the employer’s discretion. &amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;strong&gt;Please Note:&lt;/strong&gt;&amp;nbsp;Candidates will be required to provide proof of their valid certificates and licenses, per the educational technical qualifications, prior to being invited for an interview.&lt;br&gt;&lt;br&gt;&lt;strong&gt;COMPETENCIES&lt;/strong&gt;:­ Teamwork &amp;amp; Cooperation; Communications; Analytical Thinking; Decision Making; Valuing Diversity; Organization &amp;amp; Planning.&lt;br&gt;&lt;br&gt;&lt;strong&gt;WORK STATUS:&lt;/strong&gt; ­Full-time, Permanent.&lt;br&gt;&lt;br&gt;&lt;strong&gt;HOURS OF WORK:&lt;/strong&gt;&amp;nbsp;Sunday to Wednesday, 9:30pm - 7:30am; 40 hours per week. This position works holidays that fall on scheduled workdays.&lt;br&gt;&lt;br&gt;&lt;strong&gt;SALARY:­ &lt;/strong&gt;$40.24/hour for Red Seal Automotive Mechanics according to the Collective Agreement between the Amalgamated Transit Union, Local 508 and Halifax Regional Municipality.&amp;nbsp;Shift premium of $2.00 per hour for shifts commencing between 3:30pm and midnight.&lt;br&gt;&lt;br&gt;&lt;strong&gt;WORK LOCATION:&lt;/strong&gt;&amp;nbsp;Burnside Transit Centre, 200 Ilsley Ave, Dartmouth.&lt;br&gt;&lt;br&gt;&lt;strong&gt;CLOSING DATE: &lt;/strong&gt;Applications will be received up to&amp;nbsp;&lt;strong&gt;11:59 pm on Thursday, November 12, 2026.&amp;nbsp;&lt;/strong&gt;Both paper and online applications will be accepted.&amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;strong&gt;This is a bargaining unit position.­ External applicants will only be considered if there are no qualified bargaining unit candidates.&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&lt;strong&gt;Please note:&lt;/strong&gt; We thank all applicants for their interest in this position. Only those applicants selected for an interview/ testing will be contacted.&lt;br&gt;&lt;br&gt;To ensure a fair and equitable hiring process, candidates are expected to complete all parts of the recruitment process, including assessments, assignments, and interviews independently and without the use of artificial intelligence (AI) tools or other forms of external assistance. The use of AI to complete any component of the hiring process is not permitted and may result in disqualification from consideration.&lt;br&gt;&lt;br&gt;Shortlisted candidates will be required to provide proof of their qualifications, including, but not limited to, educational credentials, professional licenses, and relevant certifications.&lt;br&gt;&amp;nbsp;&lt;br&gt;During the recruitment process, applicants have the right to request an accommodation. Applicants invited to participate in an assessment process (such as interview or testing) and who require an accommodation, should discuss their needs with the Talent Acquisition Advisor when invited to the assessment process. For more information on our accommodation process please click on the link;&amp;nbsp;&lt;a href=\&quot;https://www.halifax.ca/about-halifax/employment/work-halifax-regional-municipality/accommodations-employment\&quot;&gt;Accommodations | Hiring | Employment | Halifax&lt;/a&gt;&lt;br&gt;&lt;br&gt;(position # 78640422)&lt;/p&gt;&quot;, &quot;ActualValueFromSolar&quot;: null, &quot;QuestionDescription&quot;: null, &quot;QuestionType uot;: false, &quot;selectedOptions&quot;: null, &quot;SelectedOptionsFromSavedSearch&quot;: null}, {&quot;QId&quot;: 1, &quot;QuestionName&quot;: &quot;lastupdated&quot;, &quot;Value&quot;: &quot;05-Nov-2026&quot;, &quot;ActualValueFromSolar&quot;: null, &quot;QuestionDescription&quot;: null, &quot;QuestionType&quot;: null, &quot;QuestionNumber&quot;: null, &quot;VerityZone&quot;: null, &quot;IsAutoComplete&quot;: false, &quot;IsChildQuestion&quot;: false, &quot;IsParentQuestion&quot;: false, &quot;ParentQuestionId&quot;: 0, &quot;Options&quot;: null, &quot;AjaxLoad&quot;: false, &quot;selectedOptions&quot;: null, &quot;SelectedOptionsFromSavedSearch&quot;: null}, {&quot;QId&quot;: 1, &quot;QuestionName&quot;: &quot;jobtitle&quot;, &quot;Value&quot;: &quot;Manager, Transit Infrastructure&quot;, &quot;ActualValueFromSolar&quot;: null, &quot;QuestionDescription&quot;: null, &quot;QuestionType&quot;: null, &quot;QuestionNumber&quot;: null, &quot;VerityZone&quot;: null, &quot;IsAutoComplete&quot;: false, &quot;IsChildQuestion&quot;: false, &quot;IsParentQuestion&quot;: false, &quot;ParentQuestionId&quot;: 0, &quot;Options&quot;: null, &quot;AjaxLoad&quot;: false, &quot;selectedOptions&quot;: null, &quot;SelectedOptionsFromSavedSearch&quot;: null}, {&quot;QId&quot;: 1, &quot;QuestionName&quot;: &quot;jobdescription&quot;, &quot;Value&quot;: &quot;Halifax Regional Municipality is inviting applications for the permanent Full-Time position of Manager, Transit Infrastructure, in the Planning and Customer Engagement division of Halifax Transit.&lt;br&gt;&lt;br&gt;Halifax Regional Municipality (HRM) is committed to reflecting on the community it serves and recognizing Diversity and Inclusion as one of the Municipality’s core values. We have an Employment Equity Policy, and we welcome applications from African Nova Scotians and Other Racially Visible Persons, Women in occupations or positions where they are underrepresented in the workforce, Indigenous/Aboriginal People, Persons with Disabilities and 2SLGBTQ+ Persons. &amp;nbsp;Applicants are encouraged to self-identify on their electronic application.&amp;nbsp;&lt;br&gt;&lt;br&gt;Under the general direction of the Director, Planning and Customer Engagement the Manager, Transit Infrastructure, is accountable for the successful delivery of transit programs and infrastructure initiatives that translate capital investment into operational, customer ready transit services. Leading a multidisciplinary team of project managers and technical staff, the role focuses on planning, coordination, and implementation of transit infrastructure and service readiness across projects of varying scale and complexity. By providing transit subject matter leadership and coordinating across internal and external delivery partners, this position ensures that new or improved transit facilities, services, and technologies are fully aligned with operational needs, service plans, and customer expectations at launch.&lt;br&gt;&lt;br&gt;&lt;strong&gt;DUTIES AND RESPONSIBILITIES:&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Provides strategic guidance and direction for improvements to on street transit passenger infrastructure at bus stops, including hard surfaces, shelters, benches, signage, and other customer amenities.&lt;/li&gt;&lt;li&gt;Leads the planning and implementation of on street transit priority measures of varying scale and complexity across diverse urban contexts.&lt;/li&gt;&lt;li&gt;Accountable for the strategic planning and coordination of off street transit infrastructure initiatives, ranging from moderate scale renovations and upgrades to new transit terminals, stations, and Park &amp;amp; Ride facilities, with a focus on operational readiness and service integration.&lt;/li&gt;&lt;li&gt;Leads and supports a multidisciplinary team of technical and professional staff, including field technicians responsible for bus stop infrastructure and project managers who deliver the transit program and operational components of multi departmental capital projects.&lt;/li&gt;&lt;li&gt;Works in close partnership with internal delivery teams responsible for design and construction to ensure transit operational, customer, and service requirements are fully integrated into capital project delivery.&lt;/li&gt;&lt;li&gt;Provides leadership and subject matter expertise to support the successful delivery of major transit initiatives—such as the introduction of new fleet technologies, new or expanded transit centres, bus rapid transit, and ferry services—by overseeing a team responsible for transit infrastructure requirements, service readiness, stakeholder coordination, and implementation planning&lt;/li&gt;&lt;li&gt;May perform other related duties as assigned.&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;QUALIFICATIONS:&lt;br&gt;Education and Experience:&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Undergraduate degree in Engineering, Transportation Planning, construction management, project management, or a related field.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Minimum of five years’ experience in coordinating and/or delivering complex multi-disciplinary capital projects.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Minimum of five years of progressive leadership experience.&lt;/li&gt;&lt;li&gt;Training and experience in project management is required.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Experience and knowledge of public transit infrastructure, including transit centres/garages, terminals, and on-street transit priority measures considered an asset.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Experience working in a unionized environment considered an asset.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Professional Engineer or Project Management Professional certification considered an asset.&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;Technical/Job Specific Knowledge and Abilities:&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Strong leadership skills.&lt;/li&gt;&lt;li&gt;Experience with budget control and monitoring for large capital projects.&lt;/li&gt;&lt;li&gt;Strong knowledge of project delivery methodology and best practices.&lt;/li&gt;&lt;li&gt;Ability to read and review technical documents and drawings for construction.&lt;/li&gt;&lt;li&gt;Strong technical knowledge of accessibility requirements and improvements to built form.&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;Please note:&lt;/strong&gt; Testing may be conducted as a component of the selection process to assess technical and job specific knowledge. Candidates, who are selected for testing, may be tested in a group setting, scheduled at the employer’s discretion&lt;br&gt;&lt;br&gt;&lt;strong&gt;COMPETENCIES:&lt;/strong&gt; .Valuing Diversity, Analytical Thinking, Conflict Management, Risk Management, Teamwork &amp;amp; Cooperation, Visioning, Strategic Thinking &amp;amp; Innovation, Networking/Relationship Building, Decision Making, Developing Others, Managing Change&amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;strong&gt;WORK STATUS:&lt;/strong&gt; Permanent, Full-Time.&lt;br&gt;&lt;br&gt;&lt;strong&gt;HOURS OF WORK&lt;/strong&gt;: Monday to Friday, 8:00 am to 4:00 pm, 35 hours per week. Additional hours may be required to meet project requirements, including the attendance of evening or weekend public meetings.&lt;br&gt;&lt;br&gt;&lt;strong&gt;SALARY&lt;/strong&gt;: Non-Union Level NU 09, $105,040 to $135,936. Salary will be determined based on relevant experience and qualifications related to the specified pay band and job. Placement above the midpoint of the pay band is typically reserved for candidates who significantly exceed the minimum qualifications, such as those with exceptional experience, specialized skills, or demonstrated achievements relevant to the role. This ensures fair and consistent compensation practices across the organization.&amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;strong&gt;WORK LOCATION:&lt;/strong&gt; TD Building, 1791 Barrington Street - 12th Floor. Work location can be changed according to operational requirements.&amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;strong&gt;CLOSING DATE:&lt;/strong
