	{"@context":"http:\/\/schema.org\/","@type":"JobPosting","title":"(3rd) Third Class Engineer","url":"https:\/\/mwra.applicantpro.com\/jobs\/4023073.html","description":"<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\"><strong>Are you looking to make a meaningful impact on public health and the environment? Join the MWRA team! We deliver some of the nation's highest-quality drinking water to 3 million residents, restored Boston Harbor, and continue to invest in protecting vital public resources. Be part of a mission-driven organization where your work truly makes a difference-in a safe, inclusive, and supportive environment.<\/strong><\/span><\/p>\n<br \/>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\"><strong>Summary: <\/strong><\/span><\/p>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Under the direction of the Thermal\/Power Plant Chief Engineer, operates, adjusts and maintains Thermal Power equipment, as necessary to maintain required supply of heat and electrical power.<\/span><\/p>\n<br \/>\n<p><strong><span style=\"font-size:9pt;font-family:Arial, sans-serif;\">Posting Period: <\/span><\/strong><span style=\"font-size:9pt;font-family:Arial, sans-serif;\">11<\/span><span style=\"font-size:9pt;font-family:Arial, sans-serif;\">\/3\/2026 to 12\/3\/2026 <br \/><strong>Location:<\/strong> Deer Island (Winthrop), MA <br \/><strong>Salary:<\/strong> <span style=\"font-family:arial, helvetica, sans-serif;\"><span style=\"font-size:9pt;\">$80,814.13 - $115,657.84 Annually $1,554.12 - $2,224.19 Weekly<\/span><\/span><br \/><strong>Work Schedule: <\/strong>Wednesday - Sunday 3:00pm - 11:00pm<\/span><\/p>\n<br \/>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\"><strong>Key Responsibilities<\/strong><\/span><\/p>\n<ul>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Performs the proper operation of all Thermal\/Power Plant equipment high pressure boilers, steam topping turbine, combustion turbine generators, fuel oil and waste gas supply systems, diesel generators, pumps, blowers, compressors, water treatment cooling and heating systems, electrical distribution, instrumentation systems, hydroturbines, and burner management systems.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Performs standard operating procedures (SOPs) for the Thermal\/Power Plant and the electrical distribution system.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Performs casualty control training as required.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Inspects engineering plant machinery and operation to determine efficiency and need for maintenance requirements.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Lubricates equipment and machinery.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Communicates with other Thermal\/Plant personnel on the Thermal\/Power Plant Operations.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Adheres and knows Lockout\/Tagout procedures for equipment in the Thermal\/Power Plant.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Maintains operating logs and records properly.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Contributes to a safe working environment and follows safety policies.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Monitors gauges, meters and recording devices and makes adjustments to maintain specified pressures and temperature, flows, amperage, voltage and power.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Makes ordinary repairs such as replacing gaskets, re-packing pumps, cleaning, scraping and washing out water boxes. Assists in making minor repairs to auxiliary equipment.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Monitors steam, combustion, and hydro turbines, boilers, feed and circulating pumps, diesel engines, compressors, digester gas systems, digital control systems, etc., controls steam water\/oil flows as required.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Collects water, steam, oil, and gas samples and tests to determine quality. Records results and reports abnormalities to 2nd Class Engineer.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Maintains a clean and orderly work area.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Directs all chemical and fuel deliveries\/ordering as required.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Prepares injury and illness reports, safety work orders and maintenance work order requests as necessary.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Performs light maintenance independently or as part of a team. Light maintenance shall include but not limited to:<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Operation of forklift or other light equipment that does not require a special license.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Generates inspection lists and maintenance reporting through the Computerized Maintenance Management System.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Inspects and troubleshoots various systems and equipment<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Installs and retrofits\/new equipment related to plant systems.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Modifies and\/or aligns existing equipment to specifications.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">With proper training sets up ladders, staging and rigging and utilizes hoists, jacks, dollies, lifts, etc. for proper access to job and to remove and install equipment.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Operates portable pumping, ventilation and other equipment necessary to support and accomplish assigned tasks.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Greases and lubricates, replaces oil reserves, minor packing adjustments and opens hatches.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Installs safety rails, changes light bulbs and replaces HVAC filters.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Conducts routine testing, lockout\/tagout, operation (startup\/shutdown) and adjustment of process equipment.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Removes snow from immediate work area in order to perform tasks.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Performs necessary cleanup and housekeeping for work area and other light maintenance tasks.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Performs other related duties as required.<\/span><\/li>\n<\/ul>\n<br \/>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\"><strong>Required Qualifications<\/strong><\/span><\/p>\n<ul>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Basic technical and communication skills as normally attained through a high school education or the equivalent; and<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">At least three (3) years of experience in the operation of Thermal\/Power Plant equipment, high pressure boilers, topping turbines and related auxiliary equipment; or<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Any equivalent combination of education and experience.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">A valid Massachusetts Third Class Engineer's License.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Complete productivity improvement competency-based training program related to <strong>ESSENTIAL DUTIES AND RESPONSIBILITIES <\/strong>as outlined above and successfully demonstrates required competencies.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">This position has been designated as essential in instances where the MWRA Executive Director requires essential personnel to report to work such as inclement weather or other emergencies.<\/span><\/li>\n<\/ul>\n<br \/>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\"><strong>Knowledge and Abilities<\/strong><\/span><\/p>\n<ul>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Knowledge of operation of generating equipment, plant heating, large diesel-fuel engines and electrical distribution systems.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Ability to plan, organize and perform assigned duties independently.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Ability to understand responsibility and work with minimal supervision.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Extensive knowledge of safety practices and application in Steam Engineering and Wastewater Facilities.<\/span><\/li>\n<li><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Ability to work as a team to support the goals of Deer Island Facility.<\/span><\/li>\n<\/ul>\n<br \/>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\"><strong>Tools and Equipment Used<\/strong><\/span><\/p>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Motor vehicle including forklift, power and hand tools, mobile radio, telephone, and beeper.<\/span><\/p>\n<br \/>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\"><strong>Physical Demands<\/strong><\/span><\/p>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">The physical demands described here are representative of those that must be met by an employee to successfully perform the essential functions of this job. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions.<\/span><br \/><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">While performing the duties of this job, the employee is regularly required to use hands to finger, handle, feel or operate objects, tools, or controls and reach with hands and arms. The employee frequently is required to stoop, kneel, crouch or crawl. The employee occasionally is required to stand, walk, talk or hear, sit, climb, or balance, taste or smell. The employee must frequently lift and\/or move up to 25 pounds and occasionally lift and\/or move more than 100 pounds. Specific vision abilities required by this job include close vision, distance and peripheral vision, depth perception, and the ability to adjust focus.<\/span><\/p>\n<br \/>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\"><strong>Work Environment<\/strong><\/span><\/p>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">The work environment characteristics described here are representative of those an employee encounters while performing the essential functions of this job.<\/span><br \/><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">While performing the duties of this job, the employee regularly works in an office environment. The employee occasionally works in outside weather conditions. The employee occasionally works near moving mechanical parts and is occasionally exposed to wet and\/or humid conditions and vibration. The employee occasionally works in high, precarious places and is occasionally exposed to fumes or airborne particles, toxic or caustic chemicals, and risk of electrical shock. The noise level in the work environment is usually loud in field settings, and moderately quiet in office settings.<\/span><\/p>\n<br \/>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\"><strong>Supervision Received and Exercised<\/strong><\/span><\/p>\n<p><span style=\"font-family:arial, helvetica, sans-serif;font-size:10pt;\">Works under the general supervision of the Thermal\/Power Plant Second Class Engineer.<\/span><\/p>\n<br \/>\n<p><strong><span style=\"font-size:9pt;font-family:Arial, sans-serif;\">Other Position Information <br \/>PCR: <\/span><\/strong><span style=\"font-size:9pt;font-family:Arial, sans-serif;\">2931011<\/span><span style=\"font-size:9pt;font-family:Arial, sans-serif;\"><br \/><strong>Division:<\/strong> Operations <br \/><strong>Department: <\/strong>Thermal<br \/><strong>Union\/Grade:<\/strong> NAGE(Unit 3)\/Grade 20<\/span><\/p>\n<br \/>\n<p><span style=\"font-size:10pt;\"><strong><span style=\"font-family:Arial, sans-serif;\">Massachusetts Water Resources Authority (MWRA) is an Equal Opportunity\/Affirmative Action Employer. All qualified applicants will receive consideration for employment without regard to race, color, national or ethnic origin, age, religion, disability, sex or gender, sexual orientation, gender identity or expression, or veteran status.<\/span><\/strong><\/span><\/p>","identifier":{"@type":"PropertyValue","name":"Massachusetts Water Resources Authority","sameAs":"4023073"},"datePosted":"2026-11-03 00:00:00","validThrough":"2026-12-03 00:00:00T23:59","employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","unitText":"HOUR","minValue":"79229.54","maxValue":"113390.04"}},"hiringOrganization":{"@type":"Organization","name":"Massachusetts Water Resources Authority","sameAs":"https:\/\/mwra.applicantpro.com"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"","addressLocality":"Winthrop","addressRegion":"MA","postalCode":"02152","addressCountry":"US"},"geo":{"@type":"GeoCoordinates","latitude":"42.37781729999999","longitude":"-70.98113339999997"}}}</script>
