<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"><meta http-equiv="X-UA-Compatible" content="IE=edge"><link rel="stylesheet" href="https://static.zohocdn.com/recruit/css/global-font-recruit.f994b7aa987ebc55fa9073db8c3f03f8.css" type="text/css"><title>Zoho USA</title><style>
.sorry-block {
font-family: PuviLight;
width: 570px;
margin: 50px auto;
background: var(--background-wcolor) url(https://static.zohocdn.com/recruit/images/error-page.3c2e627e5eea2db775ff487e224f144c.png) no-repeat 40px 40px;
border: 1px solid #f0f2f5;
padding: 40px;
box-sizing: border-box;
box-shadow: 1px 1px 18px 0px rgba(244,244,244,1);
}
.sorry-block h2, .sorry-block h4 {
margin: 0 0 0 80px;
font-size: 36px;
color: #8a8f98;
line-height: 25px;
font-weight: normal;
}
.sorry-block h4 {
font-size: 18px;
line-height: 35px;
}
.sorry-block p {
font-family: PuviSemibold;
margin: 0 0 0 80px;
font-size: 14px;
color: #2e353d;
}
.primarybtn:hover {
background-color: #3e79d4;
border: solid 1px #3e79d4;
border-bottom-color: #3e79d4;
cursor: pointer;
box-shadow: none;	
}
.primarybtn {
border-radius: 2px;
display: inline-block;
font-size: 14px;
padding: 2px 15px;
background-image: none;
height: auto;
color: var(--white-color);
margin: 0;
background-color: #338cf0;
border: 1px solid #338cf0;
border-bottom-color: #338cf0;
line-height: 28px;
font-family: PuviRegular;
text-decoration: none;
}
body{
font-family: PuviRegular;
}
@media screen and (max-width: 569px){
.sorry-block {
width: 96%;
margin: 40px 2%;
background: var(--background-wcolor) url(https://static.zohocdn.com/recruit/images/error-page.3c2e627e5eea2db775ff487e224f144c.png) no-repeat 20px 40px;
}
.sorry-block h4{
margin-top: 10px;
line-height: 21px;
margin-bottom: 10px;
}
}
</style></head><body><div class="sorry-block"><h2>Sorry,</h2>
<h4>This job posting is no longer available.</h4>
<p>For more details, please contact the website administrator.</p>
<p style="padding-top: 20px;">
<a class="primarybtn" rel="noopener noreferrer" href='https://recruit.zoho.in/recruit/zoho_us/'>Go home</a>
</div></body></html>
