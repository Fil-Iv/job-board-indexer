var jobs = JSON.parse('[{\x22Salary\x22:\x2270,000.00\x22,\x22Remote_Job\x22:true,\x22Posting_Title\x22:\x22TransLash Media\- Social Media Coordinator\x22,\x22Is_Locked\x22:false,\x22City\x22:null,\x22Industry\x22:\x22Marketing\x22,\x22Job_Description\x22:\x22<html>\\n <head><\\\/head>\\n <body>\\n  <span id=\\\x22spandesc\\\x22>\\n   <p>This is a remote position.<\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>About TransLash<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>Fueled by a team of journalists and media makers, TransLash Media is a multi\-platform, award\-winning organization with deep credibility and impact in the trans community and beyond.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>TransLash has grown into a bold, wide\-ranging producer of media that centers the lives and stories of transgender and gender nonconforming (TGNC) people, adding critical nuance and depth to the issues that shape national headlines. We\\u2019ve created award\-winning podcasts, critically acclaimed films, community\-sourced zines, and a growing library of personal essays and journalism by TGNC contributors. We document, create, and influence trans culture for TGNC people and those who love them. We investigate and share the bold stories that others can\\u2019t\\u2014or won\\u2019t\\u2014in order to present trans lives in their fullness and complexity. Our work sparks new conversations, builds community, and supports an expanding network of allies. Together, we\\u2019re imagining new futures for trans people\\u2014and bringing those futures to life.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>Our coverage centers trans communities and communities of color, and we especially encourage applications from people with lived experience in those communities, particularly trans people and trans people of color.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Job Summary<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>TransLash Media is seeking a reliable and collaborative Social Media Coordinator to support the Digital \x26amp; Social team across a range of content and social engagement needs for our social channels and beyond. The Social Media Coordinator reports to the Social Media Manager.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>The Social Media Coordinator ideates and produces promotional assets for TransLash\\u2019s social channels and brings fresh ideas for engaging TransLash\\u2019s audiences on Instagram, TikTok, YouTube, Bluesky, and other platforms. This role champions digital storytelling best practices and shares our commitment to keeping trans communities informed through digital media and journalism.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>Working closely with the Social Media Manager, the Community Manager, and teams across TransLash\\u2019s Podcast, Films, and Articles verticals, the Social Media Coordinator supports social promotion and outreach strategies and serves as an ambassador for the organization with partners and audiences.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>This role is fully remote and requires availability during core local business hours (9:00 a.m. to 5:00 p.m.), plus occasional evenings and weekends as needed, often in response to breaking news.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Roles and Responsibilities<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <ul style=\\\x22margin:0px 0px 10px; padding\-left:24px; color:rgb(0, 0, 0); font\-family:Arial, sans\-serif; font\-size:14px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Source, schedule, and publish timely and evergreen content for TransLash\\u2019s social channels, using diverse sources that align with the TransLash brand\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Write social media copy and create graphics that follow accessibility best practices, under the direction of the Social Media Manager\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Maintain relationships with key partners through collaborative posts, replies, and direct messages, serving as an ambassador for the organization\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Work with the Community Manager to maintain a list of partner accounts to contact for amplification when appropriate\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Monitor social media platforms for comments, replies, and direct messages, and provide timely, brand\-aligned responses in accordance with TransLash\\u2019s style and best practices guides\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Communicate proactively across teams to support social promotion and outreach strategies for all TransLash verticals (Podcast, Films, and Articles)\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Attend regular planning meetings with the Social Media Manager and the Digital \x26amp; Social team to brainstorm and pitch creative concepts for social content\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Travel occasionally to cover live events.\\n     <br><\\\/li>\\n   <\\\/ul>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><i><b>The above job description is not intended to be an all\-inclusive list of duties and standards of the position. Incumbents will follow any other instructions, and perform any other related duties, as assigned by their supervisor.<\\\/b><\\\/i>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Education and Experience<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <ul style=\\\x22margin:0px 0px 10px; padding\-left:24px; color:rgb(0, 0, 0); font\-family:Arial, sans\-serif; font\-size:14px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Demonstrated experience supporting and creating content for daily social media accounts for an agency, news, or community organization, or supporting a fast\-paced media brand that produces social media on a daily basis\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Demonstrated experience creating content for or engaging with trans communities, whether through media, community work, or customer\-facing roles\\n     <br><\\\/li>\\n   <\\\/ul>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Qualifications<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <ul style=\\\x22margin:0px 0px 10px; padding\-left:24px; color:rgb(0, 0, 0); font\-family:Arial, sans\-serif; font\-size:14px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Strong copywriting skills, with a knack for crafting engaging, brand\-aligned social media copy across multiple platforms\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Fluency in social media tools and platforms such as Canva, Later, Sprout, Instagram, TikTok, YouTube, and Bluesky\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>A regular consumer of news and social content related to and created by trans and gender non\-conforming communities, with the ability to use social media trends and analytics reports to create posts that resonate with the community\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Strong planning, prioritization, and organizational skills, with experience proactively managing multiple projects from inception through execution and reporting\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Self\-motivated and creative, able to work well independently, and eager to learn on the job and develop new skills\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Adaptable and nimble in the face of changing workflows and processes\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Demonstrated ability to work effectively with people from different cultures, backgrounds, and perspectives\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Intrinsic motivation, a strong work ethic, and a commitment to the TransLash mission\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Willingness and availability to travel occasionally to cover live events.\\n     <br><\\\/li>\\n   <\\\/ul>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Physical Requirements<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <ul style=\\\x22margin:0px 0px 10px; padding\-left:24px; color:rgb(0, 0, 0); font\-family:Arial, sans\-serif; font\-size:14px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Remaining in a stationary position, often sitting or standing for prolonged periods.\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Prolonged periods working on a computer.\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Communicating with others to exchange information.\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Repeating motions that may include the wrists, hands and\/or fingers.\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Must be able to lift 15 pounds at a time.\\n     <br><\\\/li>\\n   <\\\/ul>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Location<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>This is a fully remote position. The Social Media Coordinator may be based anywhere within the United States.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Salary<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>$70,000 annually plus benefits.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Why TransLash<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>At TransLash Media, we don\\u2019t just tell stories\\u2014we create impact. Our award\-winning journalism challenges misinformation, elevates trans voices, and strengthens democracy. By joining our team, you\\u2019ll contribute to groundbreaking investigative work that informs, empowers, and transforms public discourse.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>Here\\u2019s why working with TransLash is an opportunity unlike any other:\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Mission\-Driven Work:<\\\/b> Every project we undertake is rooted in a commitment to trans justice, truth, and democracy. Your work will directly contribute to a larger movement for equality and human rights.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Meaningful Impact:<\\\/b> Our audience is highly politically engaged and civically minded, meaning the work we produce extends far beyond storytelling\\u2014it influences policy, public opinion, and advocacy work.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Innovative Storytelling:<\\\/b> We push the boundaries of journalism through documentary podcasts, digital media, and multimedia storytelling, ensuring that critical narratives reach the widest possible audience.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Collaborative \x26amp; Inclusive Culture:<\\\/b> We believe in fostering an environment where all voices are heard, valued, and empowered. Collaboration is at the heart of everything we do.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>Benefits:<\\\/b> We are committed to providing competitive benefits to support the well\-being of our team members. Full\-time employees are eligible for the following benefits:\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <ul style=\\\x22margin:0px 0px 10px; padding\-left:24px; color:rgb(0, 0, 0); font\-family:Arial, sans\-serif; font\-size:14px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Medical Insurance\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Dental \x26amp; Vision Insurance\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Life and AD\x26amp;D Insurance\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>401k\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Annual learning stipend\\n     <br><\\\/li>\\n   <\\\/ul>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><b>How to Apply<\\\/b>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>Please click <a href=\\\x22https:\/\/zurl.to\/tEDh?source=CareerSite\\\x22 target=\\\x22_blank\\\x22>https:\/\/zurl.to\/tEDh?source=CareerSite<\\\/a>\x26nbsp;to apply and submit your resume and a brief cover letter describing your interest in this role and how your experience aligns with the responsibilities outlined.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>Along with your application, please include one to three examples of each of the following, drawn from work you\\u2019ve already created (no new work is needed).\x26nbsp;All samples should be your own original work and not generated by AI.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <ul style=\\\x22margin:0px 0px 10px; padding\-left:24px; color:rgb(0, 0, 0); font\-family:Arial, sans\-serif; font\-size:14px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Social media graphics: Instagram graphics are ideal, but graphics for any social platform, flyers, or other visual pieces are also welcome, and\\n     <br><\\\/li>\\n    <li style=\\\x22margin:0px 0px 4px\\\x22>Social media captions or copy: Instagram captions are ideal, but copy written for Facebook, Bluesky, LinkedIn, or other platforms is also welcome.\\n     <br><\\\/li>\\n   <\\\/ul>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>We\\u2019re looking to get a sense of your design instincts and writing style. If you don\\u2019t have social media\\u2013specific examples, any graphic and writing work created for social or public audiences is welcome. Please keep submissions focused; one to three examples of each is plenty.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22>Work samples are an essential component of this application. Applications submitted without relevant work samples cannot be considered. If your examples are hosted privately, please ensure that links are accessible to reviewers.\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <p style=\\\x22margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><span class=\\\x22colour\\\x22 style=\\\x22color:rgb(0, 0, 0)\\\x22><span class=\\\x22font\\\x22 style=\\\x22font\-family:Arial, sans\-serif\\\x22><span class=\\\x22size\\\x22 style=\\\x22font\-size:14px; margin:0px 0px 10px; font\-style:normal; font\-weight:400; letter\-spacing:normal; orphans:2; text\-indent:0px; text\-transform:none; widows:2; word\-spacing:0px; white\-space:normal\\\x22><i><b>TransLash is an equal opportunity employer. Applicants shall not be discriminated against because of race, religion, sex, national origin, ethnicity, age, disability, political affiliation, sexual orientation, gender identity, color, marital status, or medical condition. Reasonable accommodation will be made so that qualified disabled applicants may participate in the application process. If you seek an accommodation, please advise in writing at the time you apply.<\\\/b><\\\/i>\\n       <br><\\\/span><\\\/span><\\\/span><\\\/p>\\n   <div>\\n    <br>\\n   <\\\/div>\\n  <\\\/span>\\n  <br>\\n <\\\/body>\\n<\\\/html>\x22,\x22Work_Experience\x22:\x221\-3 years\x22,\x22Job_Type\x22:\x22Full time\x22,\x22Job_Opening_Name\x22:\x22TransLash Media\- Social Media Coordinator\x22,\x22State\x22:null,\x22Country\x22:null,\x22Zip_Code\x22:null,\x22id\x22:\x22623910000010874001\x22,\x22Publish\x22:true,\x22Date_Opened\x22:\x222026\-11\-02\x22,\x22Keep_on_Career_Site\x22:false}]');
