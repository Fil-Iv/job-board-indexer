# Apply Alembic migrations to the hosted database (Supabase) on every push to main.
# DATABASE_URL must be the Supabase *session* pooler URL (port 5432): GitHub runners
# have no IPv6 and Supabase free direct connections are IPv6-only. See docs/DEPLOY.md.
name: migrate

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "jobindex/models/**"
      - "alembic.ini"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check the secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - run: pip install -e .
      - name: alembic upgrade head
        run: |
          alembic current
          alembic upgrade head
          alembic current
